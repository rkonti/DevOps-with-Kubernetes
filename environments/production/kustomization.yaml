apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../base
  # Only production is backed up
  - backup-persistentvolumeclaim.yaml
  - backup-cronjob.yaml
patches:
  - path: configmap.yaml
# Every tagged commit: the release workflow sets these to that tag's images
images:
  - name: PROJECT/BROADCASTER
    newName: ghcr.io/rkonti/broadcaster
    newTag: fdbce340cf2c3b70bbabadaf5cebcc09e183dac2
  - name: PROJECT/TODO-APP
    newName: ghcr.io/rkonti/todo-app
    newTag: fdbce340cf2c3b70bbabadaf5cebcc09e183dac2
  - name: PROJECT/TODO-BACKEND
    newName: ghcr.io/rkonti/todo-backend
    newTag: fdbce340cf2c3b70bbabadaf5cebcc09e183dac2
