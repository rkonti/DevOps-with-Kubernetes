apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: log-writer
          image: log-output-writer:1.11
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
        - name: log-reader
          image: log-output-reader:2.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
            - name: PINGS_URL
              value: http://ping-pong-svc:2345/pings
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
