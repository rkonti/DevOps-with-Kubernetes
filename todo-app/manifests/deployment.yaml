apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-app-claim
      containers:
        - name: todo-app
          image: todo-app:2.6
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: CACHE_DIR
              value: /usr/src/app/files
            - name: IMAGE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: IMAGE_URL
            - name: IMAGE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: IMAGE_TTL_SECONDS
            - name: TODOS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: TODOS_URL
            - name: TODO_MAX_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: TODO_MAX_LENGTH
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
