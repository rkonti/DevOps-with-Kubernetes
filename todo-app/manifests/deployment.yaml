apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-app-claim
      containers:
        - name: todo-app
          image: PROJECT/TODO-APP
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            httpGet:
              path: /readyz
              port: 3000
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 3000
          env:
            - name: PORT
              value: "3000"
            - name: CACHE_DIR
              value: /usr/src/app/files
            - name: IMAGE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: IMAGE_URL
            - name: IMAGE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: IMAGE_TTL_SECONDS
            - name: TODOS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: TODOS_URL
            - name: TODO_MAX_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: TODO_MAX_LENGTH
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
