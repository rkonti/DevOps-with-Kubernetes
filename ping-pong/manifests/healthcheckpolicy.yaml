# The Gateway health checks GET / by default, which would increment the counter
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: ping-pong-healthcheck
  namespace: exercises
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /pings
  targetRef:
    group: ""
    kind: Service
    name: ping-pong-svc
