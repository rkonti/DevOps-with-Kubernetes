name: Release project

# Commits to main are released to staging, tags are released to production
on:
  push:
    branches:
      - main
    paths:
      - todo-app/**
      - todo-backend/**
      - broadcaster/**
      - environments/**
      - .github/workflows/project.yaml
    # Path filters are ignored for tags, so every tag releases production
    tags:
      - "*"

# Pushing images to ghcr.io and committing the new image tags back
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-publish-release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pick the environment
        run: |-
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |-
          for app in todo-app todo-backend broadcaster; do
            image="$REGISTRY/$app:$IMAGE_TAG"
            docker build --tag "$image" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              "$app"
            docker push "$image"
          done

      # A tag checkout is detached, so switch to the latest main for the commit
      - name: Switch to main
        run: |-
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |-
          kustomize edit set image \
            PROJECT/TODO-APP=$REGISTRY/todo-app:$IMAGE_TAG \
            PROJECT/TODO-BACKEND=$REGISTRY/todo-backend:$IMAGE_TAG \
            PROJECT/BROADCASTER=$REGISTRY/broadcaster:$IMAGE_TAG

      # Argo CD deploys whatever main describes. Commits made with
      # GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
      - name: Commit the new image tags
        uses: EndBug/add-and-commit@v10
        with:
          add: environments/${{ env.ENVIRONMENT }}/kustomization.yaml
          message: Release ${{ env.ENVIRONMENT }} ${{ env.IMAGE_TAG }}
