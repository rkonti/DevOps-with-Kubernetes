name: Release project

# Builds the images and records them in the configuration repository, which
# Argo CD deploys: commits to main go to staging, tags go to production
on:
  push:
    branches:
      - main
    paths:
      - todo-app/**
      - todo-backend/**
      - broadcaster/**
      - .github/workflows/project.yaml
    # Path filters are ignored for tags, so every tag releases production
    tags:
      - "*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CONFIG_REPOSITORY: rkonti/dwk-project-config

jobs:
  build-publish-release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pick the environment
        run: |-
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |-
          for app in todo-app todo-backend broadcaster; do
            image="$REGISTRY/$app:$IMAGE_TAG"
            docker build --tag "$image" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              "$app"
            docker push "$image"
          done

      # GITHUB_TOKEN can only write to this repository, so pushing to the
      # configuration repository needs a token with write access to it
      - name: Checkout the configuration repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONFIG_REPOSITORY }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images
        working-directory: config/environments/${{ env.ENVIRONMENT }}
        run: |-
          kustomize edit set image \
            PROJECT/TODO-APP=$REGISTRY/todo-app:$IMAGE_TAG \
            PROJECT/TODO-BACKEND=$REGISTRY/todo-backend:$IMAGE_TAG \
            PROJECT/BROADCASTER=$REGISTRY/broadcaster:$IMAGE_TAG

      - name: Commit the new image tags
        uses: EndBug/add-and-commit@v10
        with:
          cwd: config
          add: environments/${{ env.ENVIRONMENT }}/kustomization.yaml
          message: Release ${{ env.ENVIRONMENT }} ${{ env.IMAGE_TAG }} (${{ github.repository }}@${{ github.sha }})
