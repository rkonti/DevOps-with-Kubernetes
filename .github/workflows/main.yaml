name: Release project to GKE (retired)

# The GKE cluster was retired after chapter 4, so this only runs manually.
# For exercises 3.6-3.7 it ran on:
#   push:
#     branches:
#       - "**"
#     paths:
#       - todo-app/**
#       - todo-backend/**
#       - namespaces/project.yaml
#       - kustomization.yaml
#       - .github/workflows/main.yaml
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: Form the image names
        run: |-
          echo "TODO_APP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "TODO_BACKEND_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Form the namespace
        run: |-
          if [ "$BRANCH" = "main" ]; then
            echo "NAMESPACE=project" >> $GITHUB_ENV
          else
            echo "NAMESPACE=$BRANCH" >> $GITHUB_ENV
          fi 

      - name: Build
        run: |-
          docker build --tag $TODO_APP_IMAGE todo-app
          docker build --tag $TODO_BACKEND_IMAGE todo-backend

      - name: Publish
        run: |-
          docker push $TODO_APP_IMAGE
          docker push $TODO_BACKEND_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          kubectl create namespace $NAMESPACE || true 
          kustomize edit set namespace $NAMESPACE 
          kustomize edit set image PROJECT/TODO-APP=$TODO_APP_IMAGE PROJECT/TODO-BACKEND=$TODO_BACKEND_IMAGE
          kustomize build . | kubectl apply -f -
          kubectl -n $NAMESPACE rollout status deployment todo-app
          kubectl -n $NAMESPACE rollout status deployment todo-backend 
          kubectl -n $NAMESPACE get services,ingress -o wide