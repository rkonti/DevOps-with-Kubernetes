apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  # Exercise 4.6 requires that 6 replicas don't send duplicate messages
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: PROJECT/BROADCASTER
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: NATS_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: NATS_SUBJECT
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: NATS_URL
            # Created by hand, never committed. Without it the broadcaster only logs.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: broadcaster-secret
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: broadcaster-secret
                  key: TELEGRAM_CHAT_ID
                  optional: true
